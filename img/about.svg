<svg xmlns="http://www.w3.org/2000/svg" width="480" height="292" viewBox="0 0 480 292" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .code { font: 13px 'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace; fill:#a9b1d6; }
    .kw { fill:#bb9af7; } .ty { fill:#2ac3de; } .str { fill:#9ece6a; }
    .fn { fill:#7aa2f7; } .cm { fill:#565f89; font-style:italic; } .id { fill:#c0caf5; }
    .l { opacity:0; animation: in .35s ease-out forwards; }
    @keyframes in { from { opacity:0; transform:translateX(-6px); } to { opacity:1; transform:none; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
  </style>
  <rect width="480" height="292" rx="12" fill="#1a1b26"/>
  <rect width="480" height="36" rx="12" fill="#16161e"/>
  <rect y="24" width="480" height="12" fill="#16161e"/>
  <circle cx="20" cy="18" r="6" fill="#f7768e"/>
  <circle cx="40" cy="18" r="6" fill="#e0af68"/>
  <circle cx="60" cy="18" r="6" fill="#9ece6a"/>
  <text x="240" y="22" text-anchor="middle" class="code" style="fill:#565f89">Tuhin.cs</text>

  <g class="code" xml:space="preserve">
    <text x="20" y="66"  class="l" style="animation-delay:.2s"><tspan class="cm">// Eat → Sleep → Develop → Travel → Repeat</tspan></text>
    <text x="20" y="88"  class="l" style="animation-delay:.5s"><tspan class="kw">public class</tspan> <tspan class="ty">Tuhin</tspan> : <tspan class="ty">GameDeveloper</tspan></text>
    <text x="20" y="110" class="l" style="animation-delay:.8s">{</text>
    <text x="20" y="132" class="l" style="animation-delay:1.1s">    <tspan class="ty">string</tspan>[] <tspan class="id">build</tspan>   = { <tspan class="str">"Games"</tspan>, <tspan class="str">"XR Apps"</tspan>, <tspan class="str">"SaaS"</tspan> };</text>
    <text x="20" y="154" class="l" style="animation-delay:1.4s">    <tspan class="ty">string</tspan>[] <tspan class="id">explore</tspan> = { <tspan class="str">"VLMs"</tspan>, <tspan class="str">"Robotics"</tspan>, <tspan class="str">"CV"</tspan> };</text>
    <text x="20" y="176" class="l" style="animation-delay:1.7s">    <tspan class="ty">string</tspan>   <tspan class="id">stack</tspan>   = <tspan class="str">"Unity · C# · Python"</tspan>;</text>
    <text x="20" y="198" class="l" style="animation-delay:2.0s">    <tspan class="ty">string</tspan>   <tspan class="id">now</tspan>     = <tspan class="str">"Quest 3S × VLM research"</tspan>;</text>
    <text x="20" y="242" class="l" style="animation-delay:2.4s">    <tspan class="kw">void</tspan> <tspan class="fn">Update</tspan>() =&gt; <tspan class="fn">Ship</tspan>();</text>
    <text x="20" y="264" class="l" style="animation-delay:2.7s">}</text>
  </g>
  <rect x="31" y="252" width="8" height="15" fill="#7aa2f7" class="cursor"/>
</svg>
